
services:
  frontend:
    build:
      context: ../..
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    image: ${DOCKER_REGISTRY:-ledgerline}/frontend:${TAG:-latest}
    container_name: ledgerline-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    networks:
      - ledgerline-net