
services:
  backend:
    build:
      context: ../../backend
      dockerfile: ../docker/backend/Dockerfile
    image: ${DOCKER_REGISTRY:-ledgerline}/backend:${TAG:-latest}
    container_name: ledgerline-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-bankingdb}
      DB_USERNAME: ${DB_USERNAME:-banking_user}
      DB_PASSWORD: ${DB_PASSWORD:-banking_pass123}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - ledgerline-net